services:
  backend:
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-axel}:${POSTGRES_PASSWORD:?Set a unique POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-axel}
      SECRET_KEY: ${SECRET_KEY:?Set a unique SECRET_KEY in .env}
      ENVIRONMENT: production
      DOMAIN: ${DOMAIN:?Set the production DOMAIN in .env}
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:?Set TRUSTED_HOSTS to the production domain}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set the production HTTPS CORS_ORIGINS}
      ENABLE_DEMO_SEED: "false"
      USE_SECURE_AUTH_COOKIES: "true"
      REFRESH_COOKIE_SAMESITE: ${REFRESH_COOKIE_SAMESITE:-lax}

      EMAIL_BACKEND: smtp
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST for production email}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      EMAIL_FROM: ${EMAIL_FROM:?Set EMAIL_FROM for production email}
      NOTIFICATION_WORKER_ENABLED: "true"
      NOTIFICATION_POLL_INTERVAL_SECONDS: ${NOTIFICATION_POLL_INTERVAL_SECONDS:-30}
      NOTIFICATION_SCHEDULE_HORIZON_HOURS: ${NOTIFICATION_SCHEDULE_HORIZON_HOURS:-48}
      NOTIFICATION_RETRY_BASE_SECONDS: ${NOTIFICATION_RETRY_BASE_SECONDS:-60}
      NOTIFICATION_RETRY_MAX_SECONDS: ${NOTIFICATION_RETRY_MAX_SECONDS:-3600}
      NOTIFICATION_MAX_ATTEMPTS: ${NOTIFICATION_MAX_ATTEMPTS:-5}
      NOTIFICATION_CLAIM_TIMEOUT_SECONDS: ${NOTIFICATION_CLAIM_TIMEOUT_SECONDS:-300}
      NOTIFICATION_BATCH_SIZE: ${NOTIFICATION_BATCH_SIZE:-20}
      YOOKASSA_ENABLED: ${YOOKASSA_ENABLED:-false}
      YOOKASSA_SHOP_ID: ${YOOKASSA_SHOP_ID:-}
      YOOKASSA_SECRET_KEY: ${YOOKASSA_SECRET_KEY:-}
      YOOKASSA_RETURN_URL: ${YOOKASSA_RETURN_URL:-https://${DOMAIN}/billing/return}
      YOOKASSA_CURRENCY: ${YOOKASSA_CURRENCY:-RUB}
      YOOKASSA_CAPTURE: ${YOOKASSA_CAPTURE:-true}
      YOOKASSA_WEBHOOK_IP_CHECK_ENABLED: ${YOOKASSA_WEBHOOK_IP_CHECK_ENABLED:-true}
      YOOKASSA_REQUEST_TIMEOUT_SECONDS: ${YOOKASSA_REQUEST_TIMEOUT_SECONDS:-30}
      YOOKASSA_RECEIPT_MODE: ${YOOKASSA_RECEIPT_MODE:-disabled}
      YOOKASSA_VAT_CODE: ${YOOKASSA_VAT_CODE:-}
      YOOKASSA_TAX_SYSTEM_CODE: ${YOOKASSA_TAX_SYSTEM_CODE:-}
      YOOKASSA_PAYMENT_SUBJECT: ${YOOKASSA_PAYMENT_SUBJECT:-service}
      YOOKASSA_PAYMENT_MODE: ${YOOKASSA_PAYMENT_MODE:-full_payment}
      SUBSCRIPTION_GRACE_PERIOD_DAYS: ${SUBSCRIPTION_GRACE_PERIOD_DAYS:-3}
      SUBSCRIPTION_RETRY_DELAYS_HOURS: ${SUBSCRIPTION_RETRY_DELAYS_HOURS:-24,72}
      SUBSCRIPTION_WORKER_POLL_INTERVAL_SECONDS: ${SUBSCRIPTION_WORKER_POLL_INTERVAL_SECONDS:-300}
      SUBSCRIPTION_WORKER_BATCH_SIZE: ${SUBSCRIPTION_WORKER_BATCH_SIZE:-20}
      EXECUTIVE_PLAN_ENABLED: ${EXECUTIVE_PLAN_ENABLED:-true}

    ports: !reset []

  frontend:
    build:
      args:
        VITE_API_URL: /api/v1
        VITE_ENABLE_DEMO_LOGIN: "false"
        VITE_DEMO_PASSWORD: ""

    ports: !reset []

  caddy:
    image: caddy:2.10-alpine

    environment:
      DOMAIN: ${DOMAIN:?Set the production DOMAIN in .env}

    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"

    dns:
      - 1.1.1.1
      - 8.8.8.8

    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

    depends_on:
      frontend:
        condition: service_healthy

    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
